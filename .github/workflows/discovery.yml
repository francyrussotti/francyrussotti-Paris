name: 🔎 Auto-discovery aziende Parigi

on:
  schedule:
    - cron: "0 5 * * 1,3,5"   # lunedì, mercoledì, venerdì alle 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright + Chromium
        run: |
          playwright install chromium
          sudo $(which playwright) install-deps chromium

      - name: Run discovery
        run: python discover_companies.py

      - name: Commit discovered_slugs.json e cache
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add discovered_slugs.json discovery_cache.json
          git commit -m "update discovered companies" || echo "no changes"
          git push
