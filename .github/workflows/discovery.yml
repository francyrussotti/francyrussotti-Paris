name: 🔎 Auto-discovery aziende Parigi

on:
  schedule:
    # lunedì, mercoledì, venerdì alle 01:37 UTC: prima della newsletter (02:52 UTC),
    # così le aziende nuove entrano già nella mail dello stesso giorno.
    - cron: "37 1 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright + Chromium
        run: |
          playwright install chromium
          sudo $(which playwright) install-deps chromium

      - name: Run discovery
        run: python discover_companies.py

      - name: Commit discovered_slugs.json e cache
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add discovered_slugs.json discovery_cache.json
          if git diff --staged --quiet; then
            echo "Nessuna modifica da salvare"
            exit 0
          fi
          git commit -m "update discovered companies"
          # Se nel frattempo il branch è cambiato (es. l'altra automazione ha
          # salvato i suoi file), riallinea invece di fallire.
          for tentativo in 1 2 3; do
            if git push; then
              echo "Push riuscito al tentativo $tentativo"
              exit 0
            fi
            echo "Push fallito (tentativo $tentativo), riallineo con il remoto..."
            git pull --rebase --autostash
          done
          echo "Push fallito dopo 3 tentativi"
          exit 1
