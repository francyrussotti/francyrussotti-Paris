name: 🗼 Paris Job Newsletter

on:
  schedule:
    - cron: "0 7 * * *"   # ogni giorno alle 07:00 UTC (~08:00/09:00 ora di Parigi)
  workflow_dispatch:        # permette anche l'avvio manuale da GitHub

permissions:
  contents: write

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # 5 ore: nessuna fretta, l'importante è che la mail arrivi completa.
                         # Resta comunque sotto il tetto massimo di GitHub Actions (6 ore).
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright + Chromium
        run: |
          playwright install chromium
          sudo $(which playwright) install-deps chromium

      - name: Run newsletter script
        env:
          GMAIL_MITTENTE: ${{ secrets.GMAIL_MITTENTE }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
          PYTHONUNBUFFERED: "1"  # log visibili in tempo reale, non tutti alla fine
        run: python paris_job_newsletter.py

      - name: Commit seen_jobs.json
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add seen_jobs.json stats_storico.json slug_inattivi.json aziende_note.json
          git commit -m "update seen jobs" || echo "no changes"
          git push
